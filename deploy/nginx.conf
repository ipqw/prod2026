server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Каталог товаров приложение читает с cache: 'no-store' — кеш здесь его бы перебил.
    location = /data.json {
        add_header Cache-Control "no-store";
    }

    # Имена файлов без хешей: кешируем ненадолго, чтобы правка доехала до посетителя за час.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
